# Fallback only. Healyx.xcodeproj is checked in and opens directly in Xcode.
# If it ever fails to open, regenerate it with XcodeGen:
#   brew install xcodegen && cd apple && xcodegen
name: Healyx
options:
  bundleIdPrefix: health.healyx
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
  HealyxKit:
    path: HealyxKit
targets:
  Healyx:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Healyx
    dependencies:
      - package: Supabase
        product: Supabase
      - package: HealyxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: health.healyx.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Healyx/Healyx.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Healyx
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSCalendarsUsageDescription: Healyx adds the appointment, medication and refill reminders you choose to your calendar.
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: Healyx adds the appointment, medication and refill reminders you choose to your calendar. It never reads your calendar.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
